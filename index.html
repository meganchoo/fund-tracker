<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金收益追踪器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2128;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-blue: #58a6ff;
            --accent-purple: #a371f7;
            --accent-orange: #d29922;
            --glow-green: rgba(63, 185, 80, 0.15);
            --glow-red: rgba(248, 81, 73, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient-1 {
            position: absolute;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.08) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }

        .bg-gradient-2 {
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(163, 113, 247, 0.06) 0%, transparent 70%);
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, 30px) rotate(5deg); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Summary Cards */
        .summary-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .summary-card:hover::before {
            opacity: 1;
        }

        .summary-card.total {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .summary-card.total {
                grid-column: span 1;
            }
        }

        .summary-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .summary-card.total .summary-value {
            font-size: 2.2rem;
        }

        .summary-value.positive {
            color: var(--accent-green);
        }

        .summary-value.negative {
            color: var(--accent-red);
        }

        .summary-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Add Fund Section */
        .add-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .add-section h3 {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(88, 166, 255, 0.3);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* Refresh Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .last-update {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .last-update .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auto-refresh label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .toggle {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle.active::after {
            transform: translateX(22px);
        }

        .btn-refresh {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn-refresh.loading svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Fund List */
        .fund-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .fund-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out both;
        }

        .fund-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.1);
        }

        .fund-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .fund-info h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .fund-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .fund-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .fund-delete:hover {
            background: var(--glow-red);
            color: var(--accent-red);
        }

        .fund-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .fund-stat {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
        }

        .fund-stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .fund-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .fund-stat-value.positive {
            color: var(--accent-green);
        }

        .fund-stat-value.negative {
            color: var(--accent-red);
        }

        .fund-stat-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success {
            border-color: var(--accent-green);
        }

        .toast.error {
            border-color: var(--accent-red);
        }

        .toast-icon {
            font-size: 1.2rem;
        }

        .toast-message {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .summary-card.total .summary-value {
                font-size: 1.8rem;
            }

            .fund-card {
                padding: 20px;
            }

            .fund-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .add-form {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .auto-refresh {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effects">
        <div class="bg-gradient-1"></div>
        <div class="bg-gradient-2"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>📈 基金收益追踪</h1>
            <p>实时追踪你的基金收益情况</p>
        </header>

        <!-- Summary Cards -->
        <section class="summary-section" id="summarySection">
            <div class="summary-card total">
                <div class="summary-label">总收益</div>
                <div class="summary-value" id="totalProfit">¥0.00</div>
                <div class="summary-sub" id="totalProfitRate">收益率 0.00%</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">总市值</div>
                <div class="summary-value" id="totalValue">¥0.00</div>
                <div class="summary-sub" id="totalCost">成本 ¥0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">今日收益</div>
                <div class="summary-value" id="todayProfit">¥0.00</div>
                <div class="summary-sub" id="todayProfitRate">-</div>
            </div>
        </section>

        <!-- Add Fund Section -->
        <section class="add-section">
            <h3>➕ 添加基金</h3>
            <form class="add-form" id="addFundForm">
                <div class="input-group">
                    <label>基金代码</label>
                    <input type="text" id="fundCode" placeholder="如 000001" required>
                </div>
                <div class="input-group">
                    <label>持有份额</label>
                    <input type="number" id="fundShares" placeholder="如 1000" step="0.01" required>
                </div>
                <div class="input-group">
                    <label>买入成本价</label>
                    <input type="number" id="fundCost" placeholder="如 1.5000" step="0.0001" required>
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </section>

        <!-- Controls -->
        <div class="controls">
            <div class="last-update">
                <span class="dot"></span>
                <span id="lastUpdate">最后更新: --</span>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div class="auto-refresh">
                    <label>自动刷新</label>
                    <div class="toggle active" id="autoRefreshToggle"></div>
                </div>
                <button class="btn-refresh" id="refreshBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    刷新
                </button>
            </div>
        </div>

        <!-- Fund List -->
        <div class="fund-list" id="fundList">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                <h3>暂无基金</h3>
                <p>添加你的第一只基金开始追踪收益</p>
            </div>
        </div>

        <footer class="footer">
            <p>数据来源: 天天基金网 | 每分钟自动更新</p>
        </footer>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // ========== 状态管理 ==========
        const defaultFunds = [{"code":"006555","shares":19907.03,"cost":2.6121}];
        const savedFunds = localStorage.getItem('funds');
        const state = {
            funds: savedFunds ? JSON.parse(savedFunds) : defaultFunds,
            fundData: {},  // 存储从API获取的基金实时数据
            autoRefresh: true,
            refreshInterval: 60000, // 1分钟
            refreshTimer: null
        };

        // ========== DOM 元素 ==========
        const elements = {
            fundList: document.getElementById('fundList'),
            emptyState: document.getElementById('emptyState'),
            addFundForm: document.getElementById('addFundForm'),
            fundCode: document.getElementById('fundCode'),
            fundShares: document.getElementById('fundShares'),
            fundCost: document.getElementById('fundCost'),
            refreshBtn: document.getElementById('refreshBtn'),
            autoRefreshToggle: document.getElementById('autoRefreshToggle'),
            lastUpdate: document.getElementById('lastUpdate'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            toastContainer: document.getElementById('toastContainer'),
            totalProfit: document.getElementById('totalProfit'),
            totalProfitRate: document.getElementById('totalProfitRate'),
            totalValue: document.getElementById('totalValue'),
            totalCost: document.getElementById('totalCost'),
            todayProfit: document.getElementById('todayProfit'),
            todayProfitRate: document.getElementById('todayProfitRate')
        };

        // ========== 工具函数 ==========
        function formatMoney(num) {
            return '¥' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function formatPercent(num) {
            const sign = num >= 0 ? '+' : '';
            return sign + num.toFixed(2) + '%';
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✅' : '❌'}</span>
                <span class="toast-message">${message}</span>
            `;
            elements.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showLoading() {
            elements.loadingOverlay.classList.add('active');
            elements.refreshBtn.classList.add('loading');
        }

        function hideLoading() {
            elements.loadingOverlay.classList.remove('active');
            elements.refreshBtn.classList.remove('loading');
        }

        function saveFunds() {
            localStorage.setItem('funds', JSON.stringify(state.funds));
        }

        // ========== 基金数据获取 ==========
        async function fetchFundData(fundCode) {
            return new Promise((resolve, reject) => {
                try {
                    // 使用 JSONP 方式获取数据（天天基金API支持JSONP）
                    const callbackName = 'fundCallback_' + Date.now();
                    const url = `https://fundgz.1234567.com.cn/js/${fundCode}.js?rt=${Date.now()}&callback=${callbackName}`;
                    
                    // 创建 script 标签
                    const script = document.createElement('script');
                    script.src = url;
                    
                    // 设置超时
                    const timeout = setTimeout(() => {
                        cleanup();
                        resolve(null);
                    }, 10000);
                    
                    // 清理函数
                    function cleanup() {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) {
                            script.parentNode.removeChild(script);
                        }
                    }
                    
                    // JSONP 回调函数
                    window[callbackName] = function(data) {
                        cleanup();
                        if (data && data.fundcode) {
                            resolve({
                                name: data.name,
                                code: data.fundcode,
                                netWorth: parseFloat(data.dwjz),
                                todayWorth: parseFloat(data.gsz),
                                todayRate: parseFloat(data.gszzl),
                                updateTime: data.gztime
                            });
                        } else {
                            resolve(null);
                        }
                    };
                    
                    // 错误处理
                    script.onerror = function() {
                        cleanup();
                        resolve(null);
                    };
                    
                    // 加载脚本
                    document.head.appendChild(script);
                    
                } catch (error) {
                    console.error(`获取基金 ${fundCode} 数据失败:`, error);
                    resolve(null);
                }
            });
        }

        async function fetchAllFundsData() {
            if (state.funds.length === 0) {
                hideLoading();
                return;
            }

            showLoading();
            
            const promises = state.funds.map(fund => fetchFundData(fund.code));
            const results = await Promise.all(promises);

            results.forEach((data, index) => {
                if (data) {
                    state.fundData[state.funds[index].code] = data;
                }
            });

            hideLoading();
            updateUI();
            updateLastUpdateTime();
            saveFunds();
        }

        // ========== UI 更新 ==========
        function updateUI() {
            renderFundList();
            updateSummary();
        }

        function renderFundList() {
            if (state.funds.length === 0) {
                elements.fundList.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        <h3>暂无基金</h3>
                        <p>添加你的第一只基金开始追踪收益</p>
                    </div>
                `;
                return;
            }

            const fundCardsHTML = state.funds.map((fund, index) => {
                const data = state.fundData[fund.code];
                const delay = index * 0.1;

                if (!data) {
                    return `
                        <div class="fund-card" style="animation-delay: ${delay}s">
                            <div class="fund-card-header">
                                <div class="fund-info">
                                    <h4>${fund.code}</h4>
                                    <span class="fund-code">加载中...</span>
                                </div>
                                <button class="fund-delete" onclick="deleteFund('${fund.code}')">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M18 6L6 18M6 6l12 12"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="fund-grid">
                                <div class="fund-stat">
                                    <div class="fund-stat-label">净值</div>
                                    <div class="fund-stat-value">--</div>
                                </div>
                                <div class="fund-stat">
                                    <div class="fund-stat-label">持有份额</div>
                                    <div class="fund-stat-value">${fund.shares}</div>
                                </div>
                                <div class="fund-stat">
                                    <div class="fund-stat-label">成本</div>
                                    <div class="fund-stat-value">${formatMoney(fund.cost)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                const currentValue = data.netWorth * fund.shares;
                const cost = fund.cost * fund.shares;
                const profit = currentValue - cost;
                const profitRate = (profit / cost) * 100;
                const todayChange = data.todayRate;

                return `
                    <div class="fund-card" style="animation-delay: ${delay}s">
                        <div class="fund-card-header">
                            <div class="fund-info">
                                <h4>${data.name}</h4>
                                <span class="fund-code">${data.code}</span>
                            </div>
                            <button class="fund-delete" onclick="deleteFund('${fund.code}')">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 6L6 18M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <div class="fund-grid">
                            <div class="fund-stat">
                                <div class="fund-stat-label">单位净值</div>
                                <div class="fund-stat-value">¥${data.netWorth.toFixed(4)}</div>
                                <div class="fund-stat-sub">估值: ${formatPercent(todayChange)}</div>
                            </div>
                            <div class="fund-stat">
                                <div class="fund-stat-label">持有份额</div>
                                <div class="fund-stat-value">${fund.shares.toFixed(2)}</div>
                                <div class="fund-stat-sub">成本价 ¥${fund.cost.toFixed(4)}</div>
                            </div>
                            <div class="fund-stat">
                                <div class="fund-stat-label">持有收益</div>
                                <div class="fund-stat-value ${profit >= 0 ? 'positive' : 'negative'}">${formatMoney(profit)}</div>
                                <div class="fund-stat-sub">${formatPercent(profitRate)}</div>
                            </div>
                            <div class="fund-stat">
                                <div class="fund-stat-label">当前市值</div>
                                <div class="fund-stat-value">${formatMoney(currentValue)}</div>
                                <div class="fund-stat-sub">成本 ${formatMoney(cost)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            elements.fundList.innerHTML = fundCardsHTML;
        }

        function updateSummary() {
            let totalValue = 0;
            let totalCost = 0;
            let totalTodayChange = 0;

            state.funds.forEach(fund => {
                const data = state.fundData[fund.code];
                if (data) {
                    totalValue += data.netWorth * fund.shares;
                    totalCost += fund.cost * fund.shares;
                    totalTodayChange += data.todayRate * (data.netWorth * fund.shares);
                }
            });

            const totalProfit = totalValue - totalCost;
            const totalProfitRate = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

            elements.totalProfit.textContent = formatMoney(totalProfit);
            elements.totalProfit.className = `summary-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;
            elements.totalProfitRate.textContent = `收益率 ${formatPercent(totalProfitRate)}`;
            
            elements.totalValue.textContent = formatMoney(totalValue);
            elements.totalCost.textContent = `成本 ${formatMoney(totalCost)}`;
            
            elements.todayProfit.textContent = formatMoney(totalProfit);
            elements.todayProfit.className = `summary-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;
            elements.todayProfitRate.textContent = '今日收益';
        }

        function updateLastUpdateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            elements.lastUpdate.textContent = `最后更新: ${timeStr}`;
        }

        // ========== 基金操作 ==========
        async function addFund(code, shares, cost) {
            // 检查是否已存在
            if (state.funds.find(f => f.code === code)) {
                showToast('该基金已在列表中', 'error');
                return;
            }

            // 获取基金信息
            const data = await fetchFundData(code);
            if (!data) {
                showToast('基金代码不存在，请检查后重试', 'error');
                return;
            }

            state.funds.push({
                code: code,
                shares: parseFloat(shares),
                cost: parseFloat(cost)
            });

            state.fundData[code] = data;
            saveFunds();
            updateUI();
            
            elements.addFundForm.reset();
            showToast(`已添加 ${data.name}`);
        }

        function deleteFund(code) {
            const index = state.funds.findIndex(f => f.code === code);
            if (index > -1) {
                const fund = state.funds[index];
                const data = state.fundData[code];
                const name = data ? data.name : fund.code;
                
                state.funds.splice(index, 1);
                delete state.fundData[code];
                saveFunds();
                updateUI();
                showToast(`已删除 ${name}`);
            }
        }

        // ========== 事件处理 ==========
        elements.addFundForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = elements.fundCode.value.trim();
            const shares = elements.fundShares.value.trim();
            const cost = elements.fundCost.value.trim();
            
            if (code && shares && cost) {
                await addFund(code, shares, cost);
            }
        });

        elements.refreshBtn.addEventListener('click', fetchAllFundsData);

        elements.autoRefreshToggle.addEventListener('click', () => {
            state.autoRefresh = !state.autoRefresh;
            elements.autoRefreshToggle.classList.toggle('active', state.autoRefresh);
            
            if (state.autoRefresh) {
                startAutoRefresh();
                showToast('已开启自动刷新');
            } else {
                stopAutoRefresh();
                showToast('已关闭自动刷新');
            }
        });

        function startAutoRefresh() {
            stopAutoRefresh();
            state.refreshTimer = setInterval(fetchAllFundsData, state.refreshInterval);
        }

        function stopAutoRefresh() {
            if (state.refreshTimer) {
                clearInterval(state.refreshTimer);
                state.refreshTimer = null;
            }
        }

        // ========== 初始化 ==========
        function init() {
            // 如果是首次使用（没有保存过数据），保存默认基金
            if (!savedFunds) {
                saveFunds();
            }
            
            // 初始化UI
            updateUI();
            
            // 如果有基金，先获取数据
            if (state.funds.length > 0) {
                fetchAllFundsData();
            }
            
            // 启动自动刷新
            if (state.autoRefresh) {
                startAutoRefresh();
            }
        }

        // 启动应用
        init();
    </script>
</body>
</html>
