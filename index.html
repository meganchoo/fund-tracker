<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金收益追踪器 Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* 浅色极简配色 - 参考 Aivione 风格 */
            --bg-primary: #F8F7F4;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-hover: #FAFAF8;
            --border-color: #E8E6E1;
            --border-glow: rgba(139, 155, 130, 0.15);
            --text-primary: #1A1A1A;
            --text-secondary: #5C5C5C;
            --text-muted: #8A8A8A;
            --accent-green: #6B8E5A;
            --accent-green-light: rgba(107, 142, 90, 0.1);
            --accent-red: #C75B5B;
            --accent-red-light: rgba(199, 91, 91, 0.1);
            --accent-sage: #8B9B82;
            --accent-sage-light: rgba(139, 155, 130, 0.15);
            --accent-cream: #F5F3EE;
            --accent-dark: #2D3436;
            --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-medium: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(139, 155, 130, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 155, 130, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .bg-glow-1 {
            position: absolute;
            top: -10%;
            right: -5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(107, 142, 90, 0.06) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 155, 130, 0.05) 0%, transparent 60%);
            animation: pulse 10s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6B8E5A, #8B9B82, #A8B89E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Section 1: Summary Cards */
        .summary-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .summary-section { grid-template-columns: 1fr; }
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-soft);
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-sage), var(--accent-green));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-glow);
            box-shadow: var(--shadow-medium);
        }

        .summary-card:hover::before { opacity: 1; }

        .summary-card.profit { border-top: 3px solid var(--accent-green); }
        .summary-card.loss { border-top: 3px solid var(--accent-red); }
        .summary-card.total { border-top: 3px solid var(--accent-sage); }

        .summary-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .summary-card.profit .summary-icon { background: var(--accent-green-light); }
        .summary-card.loss .summary-icon { background: var(--accent-red-light); }
        .summary-card.total .summary-icon { background: var(--accent-sage-light); }

        .summary-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .summary-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .summary-card.profit .summary-value { color: var(--accent-green); }
        .summary-card.loss .summary-value { color: var(--accent-red); }
        .summary-card.total .summary-value { color: var(--text-primary); }

        .summary-change {
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-change.positive { color: var(--accent-green); }
        .summary-change.negative { color: var(--accent-red); }

        /* Section 2: Charts */
        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1100px) {
            .charts-section { grid-template-columns: 1fr; }
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-soft);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        /* Section 3: Fund Table */
        .table-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-soft);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover td {
            background: var(--bg-card-hover);
        }

        .fund-name-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fund-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .fund-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .profit-positive { color: var(--accent-green); font-weight: 600; }
        .profit-negative { color: var(--accent-red); font-weight: 600; }
        .value-mono { font-family: 'JetBrains Mono', monospace; }

        /* Section 4: Category Cards */
        .category-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .category-section { grid-template-columns: 1fr; }
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-soft);
        }

        .category-card.conservative {
            border-left: 4px solid var(--accent-green);
        }

        .category-card.aggressive {
            border-left: 4px solid var(--accent-sage);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .category-card.conservative .category-icon {
            background: var(--accent-green-light);
        }

        .category-card.aggressive .category-icon {
            background: var(--accent-sage-light);
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .category-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .category-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-item {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .last-update {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-sage));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 142, 90, 0.25);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 26, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-sage);
            box-shadow: 0 0 0 3px rgba(139, 155, 130, 0.15);
        }

        .form-select {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            box-shadow: var(--shadow-strong);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .toast.success { border-left: 3px solid var(--accent-green); }
        .toast.error { border-left: 3px solid var(--accent-red); }
    </style>
</head>
<body>
    <div class="bg-effects">
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>📊 基金收益追踪 Pro</h1>
            <p>专业级基金投资组合分析工具</p>
        </header>

        <!-- Section 1: Summary Cards -->
        <section class="summary-section">
            <div class="summary-card profit">
                <div class="summary-icon">📈</div>
                <div class="summary-label">总收益</div>
                <div class="summary-value" id="totalProfit">¥0.00</div>
                <div class="summary-change positive" id="totalProfitRate">+0.00%</div>
            </div>
            <div class="summary-card loss" id="todayCard">
                <div class="summary-icon">💰</div>
                <div class="summary-label">今日收益</div>
                <div class="summary-value" id="todayProfit">¥0.00</div>
                <div class="summary-change" id="todayProfitRate">0.00%</div>
            </div>
            <div class="summary-card total">
                <div class="summary-icon">💼</div>
                <div class="summary-label">持有总额</div>
                <div class="summary-value" id="totalValue">¥0.00</div>
                <div class="summary-change" style="color: var(--text-muted);">总市值</div>
            </div>
        </section>

        <!-- Controls -->
        <div class="controls">
            <div class="last-update">
                <span class="dot"></span>
                <span id="lastUpdate">最后更新: --</span>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-primary" onclick="openModal()">➕ 添加基金</button>
                <button class="btn btn-primary" id="refreshBtn" onclick="refreshData()">🔄 刷新数据</button>
            </div>
        </div>

        <!-- Section 2: Charts -->
        <section class="charts-section">
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">收益贡献占比</div>
                        <div class="chart-subtitle">各基金收益占总收益比例</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="profitPieChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">资产配置分布</div>
                        <div class="chart-subtitle">按市值占比分布</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="valuePieChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Section 3: Fund Table -->
        <section class="table-section">
            <div class="section-header">
                <div class="section-title">📋 基金收益明细</div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>基金名称</th>
                            <th>持有份额</th>
                            <th>成本价</th>
                            <th>当前净值</th>
                            <th>持有收益</th>
                            <th>收益率</th>
                            <th>市值</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="fundTableBody">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Section 4: Category Cards -->
        <section class="category-section">
            <div class="category-card conservative">
                <div class="category-header">
                    <div class="category-icon">🛡️</div>
                    <div>
                        <div class="category-title">稳健理财</div>
                        <div class="category-subtitle">债券型 · 低风险</div>
                    </div>
                </div>
                <div class="category-stats">
                    <div class="stat-item">
                        <div class="stat-label">今日收益</div>
                        <div class="stat-value" id="conservativeToday">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">累计收益</div>
                        <div class="stat-value" id="conservativeTotal">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">持有市值</div>
                        <div class="stat-value" id="conservativeValue">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">基金数量</div>
                        <div class="stat-value" id="conservativeCount">0</div>
                    </div>
                </div>
            </div>
            <div class="category-card aggressive">
                <div class="category-header">
                    <div class="category-icon">🚀</div>
                    <div>
                        <div class="category-title">进阶理财</div>
                        <div class="category-subtitle">股票型/QDII · 中高风险</div>
                    </div>
                </div>
                <div class="category-stats">
                    <div class="stat-item">
                        <div class="stat-label">今日收益</div>
                        <div class="stat-value" id="aggressiveToday">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">累计收益</div>
                        <div class="stat-value" id="aggressiveTotal">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">持有市值</div>
                        <div class="stat-value" id="aggressiveValue">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">基金数量</div>
                        <div class="stat-value" id="aggressiveCount">0</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">添加基金</div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <form id="addFundForm" onsubmit="addFund(event)">
                <div class="form-group">
                    <label class="form-label">基金代码</label>
                    <input type="text" class="form-input" id="fundCode" placeholder="如 000001" required>
                </div>
                <div class="form-group">
                    <label class="form-label">持有份额</label>
                    <input type="number" class="form-input" id="fundShares" placeholder="如 1000" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">成本单价</label>
                    <input type="number" class="form-input" id="fundCost" placeholder="如 1.5000" step="0.0001" required>
                </div>
                <div class="form-group">
                    <label class="form-label">基金类型</label>
                    <select class="form-select" id="fundCategory">
                        <option value="conservative">稳健理财（债券型）</option>
                        <option value="aggressive">进阶理财（股票型/QDII）</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">确认添加</button>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // 基金配置（带类型分类）
        const defaultFunds = [
            {code: "006555", shares: 19907.03, cost: 2.6121, category: "aggressive", name: "浦银安盛全球智能科技股票(QDII)A"},
            {code: "001235", shares: 78250.21, cost: 1.2780, category: "conservative", name: "中银国有企业债债券A"},
            {code: "163825", shares: 38873.35, cost: 1.2862, category: "conservative", name: "中银互利半年定期开放债券"},
            {code: "014002", shares: 13372.35, cost: 2.6173, category: "aggressive", name: "浦银安盛全球智能科技股票(QDII)C"}
        ];

        const savedFunds = localStorage.getItem('fundsPro');
        let state = {
            funds: savedFunds ? JSON.parse(savedFunds) : JSON.parse(JSON.stringify(defaultFunds)),
            fundData: {},
            profitChart: null,
            valueChart: null
        };

        // 工具函数
        function formatMoney(num) {
            return '¥' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function formatPercent(num) {
            const sign = num >= 0 ? '+' : '';
            return sign + num.toFixed(2) + '%';
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function saveFunds() {
            localStorage.setItem('fundsPro', JSON.stringify(state.funds));
        }

        // 模拟基金数据（用于本地文件打开时）
        const mockFundData = {
            "006555": { name: "浦银安盛全球智能科技股票(QDII)A", code: "006555", netWorth: 3.6879, todayWorth: 3.7021, todayRate: 0.39, updateTime: "2025-05-26 15:00" },
            "001235": { name: "中银国有企业债债券A", code: "001235", netWorth: 1.2915, todayWorth: 1.2918, todayRate: 0.02, updateTime: "2025-05-26 15:00" },
            "163825": { name: "中银互利半年定期开放债券", code: "163825", netWorth: 1.3002, todayWorth: 1.3005, todayRate: 0.02, updateTime: "2025-05-26 15:00" },
            "014002": { name: "浦银安盛全球智能科技股票(QDII)C", code: "014002", netWorth: 3.6121, todayWorth: 3.6262, todayRate: 0.39, updateTime: "2025-05-26 15:00" }
        };

        // 获取基金数据
        async function fetchFundData(fundCode) {
            // 首先尝试使用模拟数据
            if (mockFundData[fundCode]) {
                return new Promise((resolve) => {
                    setTimeout(() => resolve(mockFundData[fundCode]), 300);
                });
            }
            
            // 尝试从网络获取（在支持的浏览器中）
            return new Promise((resolve) => {
                const callbackName = 'fundCallback_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const url = `https://fundgz.1234567.com.cn/js/${fundCode}.js?rt=${Date.now()}&callback=${callbackName}`;
                const script = document.createElement('script');
                script.src = url;
                
                const timeout = setTimeout(() => {
                    cleanup();
                    resolve(null);
                }, 5000);

                function cleanup() {
                    clearTimeout(timeout);
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[callbackName] = function(data) {
                    cleanup();
                    if (data && data.fundcode) {
                        resolve({
                            name: data.name,
                            code: data.fundcode,
                            netWorth: parseFloat(data.dwjz),
                            todayWorth: parseFloat(data.gsz),
                            todayRate: parseFloat(data.gszzl),
                            updateTime: data.gztime
                        });
                    } else {
                        resolve(null);
                    }
                };

                script.onerror = () => { cleanup(); resolve(null); };
                
                try {
                    document.head.appendChild(script);
                } catch (e) {
                    cleanup();
                    resolve(null);
                }
            });
        }

        // 刷新数据
        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.innerHTML = '<span class="loading"></span> 刷新中...';
            
            const promises = state.funds.map(fund => fetchFundData(fund.code));
            const results = await Promise.all(promises);
            
            results.forEach((data, index) => {
                if (data) {
                    state.fundData[state.funds[index].code] = data;
                    // 更新基金名称（如果API返回的名称更准确）
                    if (!state.funds[index].name || state.funds[index].name.includes('浦银')) {
                        state.funds[index].name = data.name;
                    }
                }
            });

            btn.innerHTML = '🔄 刷新数据';
            updateUI();
            showToast('数据已更新');
        }

        // 更新UI
        function updateUI() {
            updateSummary();
            updateCharts();
            updateTable();
            updateCategories();
            document.getElementById('lastUpdate').textContent = '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
        }

        // 更新汇总卡片
        function updateSummary() {
            let totalProfit = 0, totalCost = 0, totalValue = 0, todayProfit = 0;

            state.funds.forEach(fund => {
                const data = state.fundData[fund.code];
                if (data) {
                    const value = data.netWorth * fund.shares;
                    const cost = fund.cost * fund.shares;
                    const profit = value - cost;
                    const todayChange = (data.todayWorth - data.netWorth) * fund.shares;

                    totalValue += value;
                    totalCost += cost;
                    totalProfit += profit;
                    todayProfit += todayChange;
                }
            });

            const totalProfitRate = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;
            const todayProfitRate = totalCost > 0 ? (todayProfit / totalCost) * 100 : 0;

            document.getElementById('totalProfit').textContent = formatMoney(totalProfit);
            document.getElementById('totalProfit').className = 'summary-value ' + (totalProfit >= 0 ? 'profit-positive' : 'profit-negative');
            document.getElementById('totalProfitRate').textContent = formatPercent(totalProfitRate);
            document.getElementById('totalProfitRate').className = 'summary-change ' + (totalProfitRate >= 0 ? 'positive' : 'negative');

            document.getElementById('todayProfit').textContent = formatMoney(todayProfit);
            document.getElementById('todayProfit').className = 'summary-value ' + (todayProfit >= 0 ? 'profit-positive' : 'profit-negative');
            document.getElementById('todayProfitRate').textContent = formatPercent(todayProfitRate);
            document.getElementById('todayProfitRate').className = 'summary-change ' + (todayProfitRate >= 0 ? 'positive' : 'negative');
            document.getElementById('todayCard').className = 'summary-card ' + (todayProfit >= 0 ? 'profit' : 'loss');

            document.getElementById('totalValue').textContent = formatMoney(totalValue);
        }

        // 柔和配色方案 - 与浅色主题协调
        const chartColors = [
            '#7EB8DA', '#A8C5A8', '#B8D4E3', '#9BC4A3',
            '#C5D5A8', '#D4C5A8', '#A8C5C5', '#C5A8C5',
            '#E8C5A8', '#A8D4C5', '#D4A8B8', '#B8A8D4'
        ];

        // 更新图表
        function updateCharts() {
            const profitData = [];
            const valueData = [];
            const labels = [];
            const profitColors = [];
            const valueColors = [];

            state.funds.forEach((fund, index) => {
                const data = state.fundData[fund.code];
                if (data) {
                    const value = data.netWorth * fund.shares;
                    const cost = fund.cost * fund.shares;
                    const profit = value - cost;

                    labels.push(fund.name || fund.code);
                    profitData.push(Math.abs(profit));
                    valueData.push(value);
                    // 使用多彩配色，每个基金不同颜色
                    profitColors.push(chartColors[index % chartColors.length]);
                    valueColors.push(chartColors[index % chartColors.length]);
                }
            });

            // 收益贡献饼图
            if (state.profitChart) state.profitChart.destroy();
            const profitCtx = document.getElementById('profitPieChart').getContext('2d');
            state.profitChart = new Chart(profitCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: profitData,
                        backgroundColor: profitColors,
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#8b949e',
                                font: { size: 11 },
                                boxWidth: 12,
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                                    return data.labels.map((label, i) => {
                                        const value = data.datasets[0].data[i];
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return {
                                            text: `${label} (${percentage}%)`,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            hidden: false,
                                            index: i
                                        };
                                    });
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const fund = state.funds[context.dataIndex];
                                    const data = state.fundData[fund.code];
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.raw / total) * 100).toFixed(1);
                                    if (data) {
                                        const profit = (data.netWorth - fund.cost) * fund.shares;
                                        return `${context.label}: ${formatMoney(profit)} (${percentage}%)`;
                                    }
                                    return `${context.label}: ${percentage}%`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });

            // 资产配置饼图
            if (state.valueChart) state.valueChart.destroy();
            const valueCtx = document.getElementById('valuePieChart').getContext('2d');
            state.valueChart = new Chart(valueCtx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: valueData,
                        backgroundColor: valueColors.slice(0, labels.length),
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#8b949e',
                                font: { size: 11 },
                                boxWidth: 12,
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                                    return data.labels.map((label, i) => {
                                        const value = data.datasets[0].data[i];
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return {
                                            text: `${label} (${percentage}%)`,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            hidden: false,
                                            index: i
                                        };
                                    });
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.raw / total) * 100).toFixed(1);
                                    return `${context.label}: ${formatMoney(context.raw)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 更新表格
        function updateTable() {
            const tbody = document.getElementById('fundTableBody');
            let html = '';

            state.funds.forEach(fund => {
                const data = state.fundData[fund.code];
                if (data) {
                    const value = data.netWorth * fund.shares;
                    const cost = fund.cost * fund.shares;
                    const profit = value - cost;
                    const profitRate = (profit / cost) * 100;

                    html += `
                        <tr>
                            <td>
                                <div class="fund-name-cell">
                                    <span class="fund-name">${fund.name || data.name}</span>
                                    <span class="fund-code">${fund.code}</span>
                                </div>
                            </td>
                            <td class="value-mono">${fund.shares.toFixed(2)}</td>
                            <td class="value-mono">¥${fund.cost.toFixed(4)}</td>
                            <td class="value-mono">¥${data.netWorth.toFixed(4)}</td>
                            <td class="${profit >= 0 ? 'profit-positive' : 'profit-negative'}">${formatMoney(profit)}</td>
                            <td class="${profitRate >= 0 ? 'profit-positive' : 'profit-negative'}">${formatPercent(profitRate)}</td>
                            <td class="value-mono">${formatMoney(value)}</td>
                            <td><button class="fund-delete" onclick="deleteFund('${fund.code}')">删除</button></td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>
                                <div class="fund-name-cell">
                                    <span class="fund-name">${fund.name || fund.code}</span>
                                    <span class="fund-code">${fund.code}</span>
                                </div>
                            </td>
                            <td colspan="7" style="text-align: center; color: var(--text-muted);">加载中...</td>
                        </tr>
                    `;
                }
            });

            tbody.innerHTML = html;
        }

        // 更新分类统计
        function updateCategories() {
            let consToday = 0, consTotal = 0, consValue = 0, consCount = 0;
            let aggToday = 0, aggTotal = 0, aggValue = 0, aggCount = 0;

            state.funds.forEach(fund => {
                const data = state.fundData[fund.code];
                if (data) {
                    const value = data.netWorth * fund.shares;
                    const cost = fund.cost * fund.shares;
                    const profit = value - cost;
                    const todayChange = (data.todayWorth - data.netWorth) * fund.shares;

                    if (fund.category === 'conservative') {
                        consToday += todayChange;
                        consTotal += profit;
                        consValue += value;
                        consCount++;
                    } else {
                        aggToday += todayChange;
                        aggTotal += profit;
                        aggValue += value;
                        aggCount++;
                    }
                }
            });

            document.getElementById('conservativeToday').textContent = formatMoney(consToday);
            document.getElementById('conservativeToday').className = 'stat-value ' + (consToday >= 0 ? 'profit-positive' : 'profit-negative');
            document.getElementById('conservativeTotal').textContent = formatMoney(consTotal);
            document.getElementById('conservativeTotal').className = 'stat-value ' + (consTotal >= 0 ? 'profit-positive' : 'profit-negative');
            document.getElementById('conservativeValue').textContent = formatMoney(consValue);
            document.getElementById('conservativeCount').textContent = consCount;

            document.getElementById('aggressiveToday').textContent = formatMoney(aggToday);
            document.getElementById('aggressiveToday').className = 'stat-value ' + (aggToday >= 0 ? 'profit-positive' : 'profit-negative');
            document.getElementById('aggressiveTotal').textContent = formatMoney(aggTotal);
            document.getElementById('aggressiveTotal').className = 'stat-value ' + (aggTotal >= 0 ? 'profit-positive' : 'profit-negative');
            document.getElementById('aggressiveValue').textContent = formatMoney(aggValue);
            document.getElementById('aggressiveCount').textContent = aggCount;
        }

        // Modal 控制
        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('addFundForm').reset();
        }

        // 添加基金
        async function addFund(e) {
            e.preventDefault();
            const code = document.getElementById('fundCode').value.trim();
            const shares = parseFloat(document.getElementById('fundShares').value);
            const cost = parseFloat(document.getElementById('fundCost').value);
            const category = document.getElementById('fundCategory').value;

            if (state.funds.find(f => f.code === code)) {
                showToast('该基金已存在', 'error');
                return;
            }

            const data = await fetchFundData(code);
            if (!data) {
                showToast('基金代码无效', 'error');
                return;
            }

            state.funds.push({
                code: code,
                shares: shares,
                cost: cost,
                category: category,
                name: data.name
            });

            state.fundData[code] = data;
            saveFunds();
            updateUI();
            closeModal();
            showToast('基金添加成功');
        }

        // 删除基金
        function deleteFund(code) {
            if (!confirm('确定要删除这只基金吗？')) return;
            
            const index = state.funds.findIndex(f => f.code === code);
            if (index > -1) {
                state.funds.splice(index, 1);
                delete state.fundData[code];
                saveFunds();
                updateUI();
                showToast('基金已删除');
            }
        }

        // 初始化
        function init() {
            if (!savedFunds) saveFunds();
            updateUI();
            refreshData();
        }

        // 点击遮罩关闭modal
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        init();
    </script>
</body>
</html>
